<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family:'General Sans'; font-weight:500; src:url('{{FONTS}}/GeneralSans-Medium.woff2') format('woff2'); }
@font-face { font-family:'General Sans'; font-weight:600; src:url('{{FONTS}}/GeneralSans-Semibold.woff2') format('woff2'); }
@font-face { font-family:'General Sans'; font-weight:700; src:url('{{FONTS}}/GeneralSans-Bold.woff2') format('woff2'); }
html,body{margin:0;padding:0}
.card{width:1200px;height:627px;position:relative;overflow:hidden;background:#0D1B2A;font-family:'General Sans',Arial,sans-serif;box-sizing:border-box;
  padding:72px 80px 0 88px;display:flex;flex-direction:column}
.mark{position:absolute;right:-120px;top:-40px;width:620px;height:620px;opacity:.16}
.mark polygon{stroke:#4F98A3}
.lock{position:relative;display:flex;align-items:center;gap:16px}
.lock img{width:64px;height:64px}
.lock .w{font-weight:600;font-size:40px;letter-spacing:-.02em;color:#fff}
h1{position:relative;margin:56px 0 0;font-weight:700;font-size:92px;line-height:1.02;letter-spacing:-.035em;color:#fff}
h1 span{color:#F5C842;display:block}
.sub{position:relative;margin-top:28px;font-size:34px;font-weight:500;color:rgba(255,255,255,.78)}
.url{position:absolute;left:88px;bottom:64px;font-size:30px;font-weight:600;color:#F5C842;letter-spacing:.01em}
</style></head><body><div class="card">
<svg class="mark" viewBox="-110 -110 220 220">{{MARK}}</svg>
<div class="lock"><img src="{{ICON}}"><span class="w">Acqlerate</span></div>
<h1>Stop winging it.<span>Learn the system.</span></h1>
<div class="sub">Plain-English DoD acquisition training.</div>
<div class="url">acqlerate.com</div>
</div></body></html>
