<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family:'General Sans'; font-weight:500; src:url('{{FONTS}}/GeneralSans-Medium.woff2') format('woff2'); }
@font-face { font-family:'General Sans'; font-weight:600; src:url('{{FONTS}}/GeneralSans-Semibold.woff2') format('woff2'); }
@font-face { font-family:'General Sans'; font-weight:700; src:url('{{FONTS}}/GeneralSans-Bold.woff2') format('woff2'); }
html,body{margin:0;padding:0}
.card{width:1200px;height:627px;position:relative;overflow:hidden;background:#fff;font-family:'General Sans',Arial,sans-serif;box-sizing:border-box;
  padding:56px 64px 0 76px;border-left:12px solid #01696F}
.glow{position:absolute;right:-160px;top:-120px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,rgba(1,105,111,.10) 0%,rgba(1,105,111,0) 68%)}
.mark{position:absolute;right:-40px;top:70px;width:520px;height:520px;opacity:.09}
.bar{position:absolute;left:0;right:0;bottom:0;height:12px;background:#01696F}
.lock{display:flex;align-items:center;gap:16px}
.lock img{width:78px;height:78px}
.lock .w{font-weight:700;font-size:46px;letter-spacing:-.02em;color:#0F172A}
.lock .w span{color:#01696F}
h1{margin:44px 0 0;font-weight:700;font-size:96px;line-height:1.0;letter-spacing:-.035em;color:#0F172A}
h1 span{color:#01696F;display:block}
.sub{margin-top:26px;font-size:30px;font-weight:500;color:#475569}
.rule{width:640px;height:3px;background:#E2E8F0;margin:28px 0 22px}
.pts{display:flex;gap:30px;font-size:25px;font-weight:600;color:#0F172A}
.pts span{display:flex;align-items:center;gap:10px}
.pts i{width:12px;height:12px;border-radius:3px;background:#01696F;transform:rotate(45deg)}
.url{position:absolute;right:64px;bottom:44px;font-size:28px;font-weight:700;color:#01696F}
</style></head><body><div class="card">
<div class="glow"></div>
<svg class="mark" viewBox="-110 -110 220 220">{{MARK}}</svg>
<div class="lock"><img src="{{ICON}}"><span class="w">Acq<span>lerate</span></span></div>
<h1>Stop winging it.<span>Learn the system.</span></h1>
<div class="sub">Plain-English DoD acquisition training, one short lesson at a time.</div>
<div class="rule"></div>
<div class="pts"><span><i></i>Short lessons</span><span><i></i>Quizzes that stick</span><span><i></i>CLP credit</span><span><i></i>Built by a DoD PM</span></div>
<div class="url">acqlerate.com</div>
<div class="bar"></div>
</div></body></html>
