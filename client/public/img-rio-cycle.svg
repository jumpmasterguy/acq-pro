<svg viewBox="0 0 1400 620" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="620" fill="#F4F3EF"/>

  <!-- Logo mark, top left, matching reference -->
  <g transform="translate(60,50)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="#01696F"/>
    <circle cx="28" cy="28" r="16" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
    <circle cx="28" cy="28" r="5" fill="#FFFFFF"/>
    <text x="70" y="37" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0D1B2A">Acq<tspan fill="#01696F">lerate</tspan></text>
  </g>

  <!-- Five steps: Identify -> Analyze -> Plan -> Track -> Control -->
  <!-- Step boxes at y=180, size 190x190, spaced with arrows between -->

  <!-- STEP 1: Identify (magnifying glass over a document) -->
  <g transform="translate(70,180)">
    <rect x="0" y="0" width="190" height="190" rx="18" fill="none" stroke="#0D1B2A" stroke-width="6"/>
    <!-- document -->
    <path d="M62 55 h50 l18 18 v70 h-68 z" fill="none" stroke="#0D1B2A" stroke-width="5" stroke-linejoin="round"/>
    <path d="M112 55 v18 h18" fill="none" stroke="#0D1B2A" stroke-width="5" stroke-linejoin="round"/>
    <line x1="70" y1="95" x2="112" y2="95" stroke="#0D1B2A" stroke-width="4"/>
    <line x1="70" y1="110" x2="102" y2="110" stroke="#0D1B2A" stroke-width="4"/>
    <!-- magnifying glass -->
    <circle cx="128" cy="130" r="24" fill="#F4F3EF" stroke="#01696F" stroke-width="6"/>
    <line x1="146" y1="148" x2="164" y2="166" stroke="#01696F" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="165" y="410" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#01696F" text-anchor="middle">IDENTIFY</text>

  <!-- arrow -->
  <path d="M280 275 h60" stroke="#D19900" stroke-width="6" fill="none"/>
  <polygon points="340,275 322,265 322,285" fill="#D19900"/>

  <!-- STEP 2: Analyze (bar chart with magnifier trend) -->
  <g transform="translate(360,180)">
    <rect x="0" y="0" width="190" height="190" rx="18" fill="none" stroke="#0D1B2A" stroke-width="6"/>
    <line x1="45" y1="150" x2="45" y2="150" stroke="#0D1B2A"/>
    <!-- axis -->
    <polyline points="45,50 45,150 155,150" fill="none" stroke="#0D1B2A" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- bars -->
    <rect x="60" y="110" width="20" height="40" fill="none" stroke="#0D1B2A" stroke-width="5"/>
    <rect x="90" y="90" width="20" height="60" fill="none" stroke="#01696F" stroke-width="5"/>
    <rect x="120" y="65" width="20" height="85" fill="none" stroke="#0D1B2A" stroke-width="5"/>
  </g>
  <text x="455" y="410" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#01696F" text-anchor="middle">ANALYZE</text>

  <path d="M570 275 h60" stroke="#D19900" stroke-width="6" fill="none"/>
  <polygon points="630,275 612,265 612,285" fill="#D19900"/>

  <!-- STEP 3: Plan (checklist / target combo, echoing reference target icon) -->
  <g transform="translate(650,180)">
    <rect x="0" y="0" width="190" height="190" rx="18" fill="none" stroke="#0D1B2A" stroke-width="6"/>
    <circle cx="95" cy="95" r="52" fill="none" stroke="#0D1B2A" stroke-width="5"/>
    <circle cx="95" cy="95" r="33" fill="none" stroke="#0D1B2A" stroke-width="5"/>
    <circle cx="95" cy="95" r="14" fill="none" stroke="#01696F" stroke-width="5"/>
    <line x1="95" y1="30" x2="95" y2="52" stroke="#D19900" stroke-width="6" stroke-linecap="round" transform="rotate(35 95 95)"/>
    <polygon points="95,22 88,38 102,38" fill="#D19900" transform="rotate(35 95 95)"/>
  </g>
  <text x="745" y="410" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#01696F" text-anchor="middle">PLAN</text>

  <path d="M860 275 h60" stroke="#D19900" stroke-width="6" fill="none"/>
  <polygon points="920,275 902,265 902,285" fill="#D19900"/>

  <!-- STEP 4: Track (line trend with dot) -->
  <g transform="translate(940,180)">
    <rect x="0" y="0" width="190" height="190" rx="18" fill="none" stroke="#0D1B2A" stroke-width="6"/>
    <polyline points="40,140 75,110 105,125 140,65 160,80" fill="none" stroke="#0D1B2A" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="140" cy="65" r="8" fill="#01696F"/>
    <line x1="35" y1="150" x2="165" y2="150" stroke="#0D1B2A" stroke-width="4"/>
  </g>
  <text x="1035" y="410" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#01696F" text-anchor="middle">TRACK</text>

  <path d="M1150 275 h60" stroke="#D19900" stroke-width="6" fill="none"/>
  <polygon points="1210,275 1192,265 1192,285" fill="#D19900"/>

  <!-- STEP 5: Control (gear with checkmark, matching reference "Execution" icon) -->
  <g transform="translate(1230,180)">
    <rect x="0" y="0" width="190" height="190" rx="18" fill="none" stroke="#0D1B2A" stroke-width="6"/>
    <g transform="translate(95,95)">
      <circle r="42" fill="none" stroke="#0D1B2A" stroke-width="5"/>
      <g stroke="#0D1B2A" stroke-width="6" stroke-linecap="round">
        <line x1="0" y1="-52" x2="0" y2="-40"/>
        <line x1="0" y1="52" x2="0" y2="40"/>
        <line x1="-52" y1="0" x2="-40" y2="0"/>
        <line x1="52" y1="0" x2="40" y2="0"/>
        <line x1="-37" y1="-37" x2="-28" y2="-28"/>
        <line x1="37" y1="37" x2="28" y2="28"/>
        <line x1="-37" y1="37" x2="-28" y2="28"/>
        <line x1="37" y1="-37" x2="28" y2="-28"/>
      </g>
      <path d="M-16 0 l12 12 l22 -26" fill="none" stroke="#01696F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="1325" y="410" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#01696F" text-anchor="middle">CONTROL</text>

  <!-- caption, matching your existing lesson_image caption style -->
  <text x="700" y="490" font-family="Georgia, serif" font-style="italic" font-size="24" fill="#0D1B2A" text-anchor="middle">Five steps, one loop. Skip "Plan" before "Identify," and you're just reacting.</text>
  <text x="700" y="530" font-family="Arial, sans-serif" font-size="17" fill="#6B7280" text-anchor="middle">The DoD RIO Management Cycle — Risk Management, Module 06</text>
</svg>
