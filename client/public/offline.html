<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Acqlerate: you're offline</title>
<!--
  Shown by the iPhone/Android app when it can't reach acqlerate.com
  (capacitor.config.ts server.errorPath). It is bundled inside the app, so it
  must work with no network: no external fonts, scripts or images.
-->
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    box-sizing: border-box;
    background: #f7f4ee; color: #0f172a;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  .card { max-width: 340px; }
  .mark {
    width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 18px;
    background: linear-gradient(155deg, #0b868c, #01696f 55%, #063c46);
    display: flex; align-items: center; justify-content: center;
  }
  h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.02em; }
  p { margin: 0 0 24px; color: #475569; }
  button {
    width: 100%; min-height: 48px; border: 0; border-radius: 12px;
    background: #01696f; color: #fff; font: 600 16px/1 inherit; font-family: inherit;
  }
  button:active { opacity: .85; }
  @media (prefers-color-scheme: dark) {
    body { background: #0b1220; color: #e2e8f0; }
    p { color: #94a3b8; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
        <path d="M11 4h18l9 16-9 16H11L2 20z" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M20 10l8.7 5v10L20 30l-8.7-5V15z" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="20" cy="20" r="2.6" fill="#fff"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Acqlerate needs a connection to load your lessons and save your progress. Check your Wi-Fi or signal, then try again.</p>
    <button onclick="location.href='https://acqlerate.com/app'">Try again</button>
  </div>
  <script>
    // Come back by itself once the connection returns.
    window.addEventListener('online', function () { location.href = 'https://acqlerate.com/app'; });
  </script>
</body>
</html>
