<svg viewBox="0 0 1300 460" xmlns="http://www.w3.org/2000/svg" width="1300" height="460">
  <rect width="1300" height="460" fill="#F4F3EF"/>

  <g transform="translate(50,40)">
    <rect x="0" y="0" width="48" height="48" rx="11" fill="#01696F"/>
    <polygon points="24.0,7.0 38.72,15.5 38.72,32.5 24.0,41.0 9.28,32.5 9.28,15.5" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linejoin="round"/>
    <polygon points="24.0,14.8 31.97,19.4 31.97,28.6 24.0,33.2 16.03,28.6 16.03,19.4" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linejoin="round"/>
    <circle cx="24" cy="24" r="3.6" fill="#FFFFFF"/>
    <text x="62" y="32" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0D1B2A">Acq<tspan fill="#01696F">lerate</tspan></text>
  </g>

  <!-- PV box: x=80-420 -->
  <g transform="translate(80,130)">
    <rect x="0" y="0" width="340" height="240" rx="16" fill="#FFFFFF" stroke="#0D1B2A" stroke-width="5"/>
    <g transform="translate(140,30)">
      <rect x="0" y="10" width="60" height="52" rx="6" fill="none" stroke="#0D1B2A" stroke-width="4.5"/>
      <line x1="0" y1="28" x2="60" y2="28" stroke="#0D1B2A" stroke-width="4.5"/>
      <line x1="15" y1="0" x2="15" y2="16" stroke="#0D1B2A" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="45" y1="0" x2="45" y2="16" stroke="#0D1B2A" stroke-width="4.5" stroke-linecap="round"/>
    </g>
    <text x="170" y="128" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#01696F" text-anchor="middle">PV</text>
    <text x="170" y="158" font-family="Arial, sans-serif" font-size="17" fill="#0D1B2A" text-anchor="middle">Planned Value</text>
    <text x="170" y="195" font-family="Arial, sans-serif" font-size="14.5" fill="#6B7280" text-anchor="middle">"What we meant to spend"</text>
    <text x="170" y="216" font-family="Arial, sans-serif" font-size="14.5" fill="#6B7280" text-anchor="middle">by this point in the schedule</text>
  </g>

  <!-- EV box: x=480-820 -->
  <g transform="translate(480,130)">
    <rect x="0" y="0" width="340" height="240" rx="16" fill="#FFFFFF" stroke="#0D1B2A" stroke-width="5"/>
    <g transform="translate(140,25)">
      <circle cx="30" cy="30" r="30" fill="none" stroke="#01696F" stroke-width="4.5"/>
      <path d="M15 31 l11 11 l21 -24" fill="none" stroke="#01696F" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="170" y="128" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#01696F" text-anchor="middle">EV</text>
    <text x="170" y="158" font-family="Arial, sans-serif" font-size="17" fill="#0D1B2A" text-anchor="middle">Earned Value</text>
    <text x="170" y="195" font-family="Arial, sans-serif" font-size="14.5" fill="#6B7280" text-anchor="middle">"What we actually finished"</text>
    <text x="170" y="216" font-family="Arial, sans-serif" font-size="14.5" fill="#6B7280" text-anchor="middle">valued at planned budget rates</text>
  </g>

  <!-- AC box: x=880-1220 -->
  <g transform="translate(880,130)">
    <rect x="0" y="0" width="340" height="240" rx="16" fill="#FFFFFF" stroke="#0D1B2A" stroke-width="5"/>
    <g transform="translate(150,25)">
      <path d="M0 0 h50 v58 l-8 -6 l-8 6 l-9 -6 l-8 6 l-9 -6 l-8 6 z" fill="none" stroke="#0D1B2A" stroke-width="4.5" stroke-linejoin="round"/>
      <line x1="10" y1="16" x2="40" y2="16" stroke="#0D1B2A" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="10" y1="28" x2="40" y2="28" stroke="#0D1B2A" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="10" y1="40" x2="30" y2="40" stroke="#0D1B2A" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="170" y="128" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#01696F" text-anchor="middle">AC</text>
    <text x="170" y="158" font-family="Arial, sans-serif" font-size="17" fill="#0D1B2A" text-anchor="middle">Actual Cost</text>
    <text x="170" y="195" font-family="Arial, sans-serif" font-size="14.5" fill="#6B7280" text-anchor="middle">"What we actually spent"</text>
    <text x="170" y="216" font-family="Arial, sans-serif" font-size="14.5" fill="#6B7280" text-anchor="middle">to get that work done</text>
  </g>

  <!-- formulas beneath, spanning the gaps between boxes -->
  <text x="480" y="415" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0D1B2A" text-anchor="middle">CPI = EV ÷ AC</text>
  <text x="480" y="438" font-family="Arial, sans-serif" font-size="14.5" fill="#6B7280" text-anchor="middle">cost efficiency</text>

  <text x="880" y="415" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0D1B2A" text-anchor="middle">SPI = EV ÷ PV</text>
  <text x="880" y="438" font-family="Arial, sans-serif" font-size="14.5" fill="#6B7280" text-anchor="middle">schedule efficiency</text>
</svg>
