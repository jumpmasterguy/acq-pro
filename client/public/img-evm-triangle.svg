<svg viewBox="0 0 1300 460" xmlns="http://www.w3.org/2000/svg" width="1300" height="460">
  <rect width="1300" height="460" fill="#F4F3EF"/>

  <g transform="translate(50,40)">
    <svg x="0" y="0" width="48" height="48" viewBox="0 0 1024 1024">

<defs>
  <linearGradient id="tileBg" x1="0.288" y1="0.045" x2="0.712" y2="0.955">
    <stop offset="0" stop-color="#0b868c"/>
    <stop offset="0.47" stop-color="#01696f"/>
    <stop offset="1" stop-color="#063c46"/>
  </linearGradient>
  <radialGradient id="bloom" gradientUnits="userSpaceOnUse"
    cx="471.04" cy="307.2" r="798.72"
    gradientTransform="matrix(1 0 0 0.8718 0 39.38)">
    <stop offset="0" stop-color="#7ecfd6" stop-opacity="0.30"/>
    <stop offset="0.75" stop-color="#7ecfd6" stop-opacity="0.06"/>
    <stop offset="1" stop-color="#7ecfd6" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="0.44">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="0" y2="0.30">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="foot" x1="0" y1="0.62" x2="0" y2="1">
    <stop offset="0" stop-color="#001418" stop-opacity="0"/>
    <stop offset="1" stop-color="#001418" stop-opacity="0.40"/>
  </linearGradient>
  <clipPath id="tileClip"><rect width="1024" height="1024" rx="229.07" ry="229.07"/></clipPath>
</defs>
<g clip-path="url(#tileClip)">
  <rect width="1024" height="1024" fill="url(#tileBg)"/>
  <rect width="1024" height="1024" fill="url(#bloom)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>
  <rect width="1024" height="1024" fill="url(#foot)"/>
  <rect x="7" y="7" width="1010" height="1010" rx="222.07" ry="222.07"
        fill="none" stroke="url(#rim)" stroke-width="14"/>
<svg x="40.96" y="40.96" width="942.08" height="942.08" viewBox="0 0 200 200" overflow="visible">
<defs>
<linearGradient id="sgm" x1="0.12" y1="0.02" x2="0.86" y2="0.98">
<stop offset="0" stop-color="#ffffff"></stop>
<stop offset="0.34" stop-color="#f6fdfe"></stop>
<stop offset="0.68" stop-color="#ddf2f5"></stop>
<stop offset="1" stop-color="#a5d4db"></stop>
</linearGradient>
<linearGradient id="slm" x1="0.1" y1="0" x2="0.9" y2="1">
<stop offset="0" stop-color="#5d9aa2"></stop>
<stop offset="1" stop-color="#3d7c86"></stop>
</linearGradient>
<linearGradient id="shm" x1="0" y1="0" x2="0.75" y2="1">
<stop offset="0" stop-color="#ffffff" stop-opacity="1"></stop>
<stop offset="0.46" stop-color="#ffffff" stop-opacity="0.62"></stop>
<stop offset="1" stop-color="#ffffff" stop-opacity="0.10"></stop>
</linearGradient>
<filter id="sdm" x="-35%" y="-35%" width="170%" height="170%">
<feDropShadow dx="0.6" dy="4.6" stdDeviation="4.2" flood-color="#01262c" flood-opacity="0.52"></feDropShadow>
</filter>
</defs>
<g filter="url(#sdm)">
<g transform="translate(0.4,0.9)" fill="none" stroke="#023f47" stroke-linejoin="round" stroke-linecap="round" opacity="0.55"><polygon points="192.00,100.00 146.00,179.67 54.00,179.67 8.00,100.00 54.00,20.33 146.00,20.33" stroke-width="15.80"></polygon><polygon points="137.59,121.70 100.00,143.40 62.41,121.70 62.41,78.30 100.00,56.60 137.59,78.30" stroke-width="13.60"></polygon></g>
<g transform="translate(1.8,2.3)" fill="none" stroke="url(#slm)" stroke-linejoin="round" stroke-linecap="round"><polygon points="192.00,100.00 146.00,179.67 54.00,179.67 8.00,100.00 54.00,20.33 146.00,20.33" stroke-width="13.0"></polygon><polygon points="137.59,121.70 100.00,143.40 62.41,121.70 62.41,78.30 100.00,56.60 137.59,78.30" stroke-width="11.0"></polygon></g>
<g fill="none" stroke="url(#sgm)" stroke-linejoin="round" stroke-linecap="round"><polygon points="192.00,100.00 146.00,179.67 54.00,179.67 8.00,100.00 54.00,20.33 146.00,20.33" stroke-width="13.0"></polygon><polygon points="137.59,121.70 100.00,143.40 62.41,121.70 62.41,78.30 100.00,56.60 137.59,78.30" stroke-width="11.0"></polygon></g>
<circle cx="100.4" cy="100.9" r="12.30" fill="#023f47" opacity="0.55"></circle>
<circle cx="101.8" cy="102.3" r="11.0" fill="url(#slm)"></circle>
<circle cx="100" cy="100" r="11.0" fill="url(#sgm)"></circle>
<g transform="translate(-1.1,-1.7)" fill="none" stroke="url(#shm)" stroke-linejoin="round" stroke-linecap="round"><polygon points="192.00,100.00 146.00,179.67 54.00,179.67 8.00,100.00 54.00,20.33 146.00,20.33" stroke-width="4.94"></polygon><polygon points="137.59,121.70 100.00,143.40 62.41,121.70 62.41,78.30 100.00,56.60 137.59,78.30" stroke-width="4.18"></polygon></g>
<circle cx="96.70" cy="96.04" r="4.84" fill="#ffffff" opacity="0.85"></circle>
</g>
</svg>
</g>
</svg>
    <text x="62" y="32" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0D1B2A">Acq<tspan fill="#01696F">lerate</tspan></text>
  </g>

  <!-- PV box: x=80-420 -->
  <g transform="translate(80,130)">
    <rect x="0" y="0" width="340" height="240" rx="16" fill="#FFFFFF" stroke="#0D1B2A" stroke-width="5"/>
    <g transform="translate(140,30)">
      <rect x="0" y="10" width="60" height="52" rx="6" fill="none" stroke="#0D1B2A" stroke-width="4.5"/>
      <line x1="0" y1="28" x2="60" y2="28" stroke="#0D1B2A" stroke-width="4.5"/>
      <line x1="15" y1="0" x2="15" y2="16" stroke="#0D1B2A" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="45" y1="0" x2="45" y2="16" stroke="#0D1B2A" stroke-width="4.5" stroke-linecap="round"/>
    </g>
    <text x="170" y="128" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#01696F" text-anchor="middle">PV</text>
    <text x="170" y="158" font-family="Arial, sans-serif" font-size="17" fill="#0D1B2A" text-anchor="middle">Planned Value</text>
    <text x="170" y="195" font-family="Arial, sans-serif" font-size="14.5" fill="#6B7280" text-anchor="middle">"What we meant to spend"</text>
    <text x="170" y="216" font-family="Arial, sans-serif" font-size="14.5" fill="#6B7280" text-anchor="middle">by this point in the schedule</text>
  </g>

  <!-- EV box: x=480-820 -->
  <g transform="translate(480,130)">
    <rect x="0" y="0" width="340" height="240" rx="16" fill="#FFFFFF" stroke="#0D1B2A" stroke-width="5"/>
    <g transform="translate(140,25)">
      <circle cx="30" cy="30" r="30" fill="none" stroke="#01696F" stroke-width="4.5"/>
      <path d="M15 31 l11 11 l21 -24" fill="none" stroke="#01696F" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="170" y="128" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#01696F" text-anchor="middle">EV</text>
    <text x="170" y="158" font-family="Arial, sans-serif" font-size="17" fill="#0D1B2A" text-anchor="middle">Earned Value</text>
    <text x="170" y="195" font-family="Arial, sans-serif" font-size="14.5" fill="#6B7280" text-anchor="middle">"What we actually finished"</text>
    <text x="170" y="216" font-family="Arial, sans-serif" font-size="14.5" fill="#6B7280" text-anchor="middle">valued at planned budget rates</text>
  </g>

  <!-- AC box: x=880-1220 -->
  <g transform="translate(880,130)">
    <rect x="0" y="0" width="340" height="240" rx="16" fill="#FFFFFF" stroke="#0D1B2A" stroke-width="5"/>
    <g transform="translate(150,25)">
      <path d="M0 0 h50 v58 l-8 -6 l-8 6 l-9 -6 l-8 6 l-9 -6 l-8 6 z" fill="none" stroke="#0D1B2A" stroke-width="4.5" stroke-linejoin="round"/>
      <line x1="10" y1="16" x2="40" y2="16" stroke="#0D1B2A" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="10" y1="28" x2="40" y2="28" stroke="#0D1B2A" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="10" y1="40" x2="30" y2="40" stroke="#0D1B2A" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="170" y="128" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#01696F" text-anchor="middle">AC</text>
    <text x="170" y="158" font-family="Arial, sans-serif" font-size="17" fill="#0D1B2A" text-anchor="middle">Actual Cost</text>
    <text x="170" y="195" font-family="Arial, sans-serif" font-size="14.5" fill="#6B7280" text-anchor="middle">"What we actually spent"</text>
    <text x="170" y="216" font-family="Arial, sans-serif" font-size="14.5" fill="#6B7280" text-anchor="middle">to get that work done</text>
  </g>

  <!-- formulas beneath, spanning the gaps between boxes -->
  <text x="480" y="415" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0D1B2A" text-anchor="middle">CPI = EV ÷ AC</text>
  <text x="480" y="438" font-family="Arial, sans-serif" font-size="14.5" fill="#6B7280" text-anchor="middle">cost efficiency</text>

  <text x="880" y="415" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0D1B2A" text-anchor="middle">SPI = EV ÷ PV</text>
  <text x="880" y="438" font-family="Arial, sans-serif" font-size="14.5" fill="#6B7280" text-anchor="middle">schedule efficiency</text>
</svg>
