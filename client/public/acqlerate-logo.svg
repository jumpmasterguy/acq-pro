<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <!-- Icon mark: teal rounded square with geometric hexagon -->
  <rect x="0" y="10" width="100" height="100" rx="22" fill="#01696f"/>
  <g transform="translate(50,60)">
    <polygon points="0,-28 24.2,-14 24.2,14 0,28 -24.2,14 -24.2,-14"
      fill="none" stroke="white" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="0,-16 13.9,-8 13.9,8 0,16 -13.9,8 -13.9,-8"
      fill="none" stroke="white" stroke-width="3" stroke-linejoin="round"
      transform="rotate(30)"/>
    <circle cx="0" cy="0" r="4" fill="white"/>
  </g>
  <!-- Wordmark using single text with tspan for color split -->
  <text x="118" y="78"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="58"
    letter-spacing="-1"
  ><tspan fill="#0f172a">Acql</tspan><tspan fill="#01696f">erate</tspan></text>
</svg>
