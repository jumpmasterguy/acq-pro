<svg viewBox="0 0 1300 420" xmlns="http://www.w3.org/2000/svg" width="1300" height="420">
  <rect width="1300" height="420" fill="#F4F3EF"/>

  <g transform="translate(50,40)">
    <rect x="0" y="0" width="48" height="48" rx="11" fill="#01696F"/>
    <circle cx="24" cy="24" r="14" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="24" cy="24" r="4.5" fill="#FFFFFF"/>
    <text x="62" y="32" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0D1B2A">Acq<tspan fill="#01696F">lerate</tspan></text>
  </g>

  <!-- LPTA box: x=100-560 -->
  <g transform="translate(100,120)">
    <rect x="0" y="0" width="460" height="260" rx="18" fill="#FFFFFF" stroke="#0D1B2A" stroke-width="5"/>
    <!-- balance scale, tipped toward the price side (left pan lower) -->
    <g transform="translate(230,40)">
      <line x1="0" y1="0" x2="0" y2="55" stroke="#0D1B2A" stroke-width="5" stroke-linecap="round"/>
      <polygon points="0,55 -14,72 14,72" fill="none" stroke="#0D1B2A" stroke-width="4.5" stroke-linejoin="round"/>
      <line x1="-55" y1="10" x2="55" y2="-4" stroke="#0D1B2A" stroke-width="5" stroke-linecap="round"/>
      <path d="M-55 10 q0 22 -18 22 q-18 0 -18 -22 z" fill="none" stroke="#01696F" stroke-width="4"/>
      <path d="M55 -4 q0 14 -12 14 q-12 0 -12 -14 z" fill="none" stroke="#0D1B2A" stroke-width="4"/>
    </g>
    <text x="230" y="165" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#01696F" text-anchor="middle">LPTA</text>
    <text x="230" y="192" font-family="Arial, sans-serif" font-size="16" fill="#0D1B2A" text-anchor="middle">Lowest Price Technically Acceptable</text>
    <text x="230" y="222" font-family="Arial, sans-serif" font-size="15" fill="#6B7280" text-anchor="middle">Meet the minimum bar, lowest price wins</text>
    <text x="230" y="248" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="#D19900" text-anchor="middle">Best for: janitorial, help desk, commodities</text>
  </g>

  <text x="650" y="260" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#0D1B2A" text-anchor="middle">vs.</text>

  <!-- Best Value box: x=740-1200 -->
  <g transform="translate(740,120)">
    <rect x="0" y="0" width="460" height="260" rx="18" fill="#FFFFFF" stroke="#0D1B2A" stroke-width="5"/>
    <!-- balance scale, tipped toward the merit side (right pan lower) -->
    <g transform="translate(230,40)">
      <line x1="0" y1="0" x2="0" y2="55" stroke="#0D1B2A" stroke-width="5" stroke-linecap="round"/>
      <polygon points="0,55 -14,72 14,72" fill="none" stroke="#0D1B2A" stroke-width="4.5" stroke-linejoin="round"/>
      <line x1="-55" y1="-4" x2="55" y2="10" stroke="#0D1B2A" stroke-width="5" stroke-linecap="round"/>
      <path d="M-55 -4 q0 14 -12 14 q-12 0 -12 -14 z" fill="none" stroke="#0D1B2A" stroke-width="4"/>
      <path d="M55 10 q0 22 -18 22 q-18 0 -18 -22 z" fill="none" stroke="#01696F" stroke-width="4"/>
    </g>
    <text x="230" y="165" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#01696F" text-anchor="middle">BEST VALUE</text>
    <text x="230" y="192" font-family="Arial, sans-serif" font-size="16" fill="#0D1B2A" text-anchor="middle">Best combination of merit + price</text>
    <text x="230" y="222" font-family="Arial, sans-serif" font-size="15" fill="#6B7280" text-anchor="middle">Willing to pay more for real technical merit</text>
    <text x="230" y="248" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="#D19900" text-anchor="middle">Best for: software, systems integration</text>
  </g>
</svg>
