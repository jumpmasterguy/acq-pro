<svg viewBox="0 0 1300 460" xmlns="http://www.w3.org/2000/svg" width="1300" height="460">
  <rect width="1300" height="460" fill="#F4F3EF"/>

  <g transform="translate(50,40)">
    <rect x="0" y="0" width="48" height="48" rx="11" fill="#01696F"/>
    <circle cx="24" cy="24" r="14" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="24" cy="24" r="4.5" fill="#FFFFFF"/>
    <text x="62" y="32" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0D1B2A">Acq<tspan fill="#01696F">lerate</tspan></text>
  </g>

  <!-- spectrum line -->
  <line x1="150" y1="380" x2="1150" y2="380" stroke="#0D1B2A" stroke-width="4"/>
  <polygon points="1150,380 1132,371 1132,389" fill="#0D1B2A"/>
  <text x="150" y="410" font-family="Arial, sans-serif" font-size="15" fill="#6B7280" text-anchor="start">Faster, less precise</text>
  <text x="1150" y="410" font-family="Arial, sans-serif" font-size="15" fill="#6B7280" text-anchor="end">Slower, more accurate</text>

  <!-- Analogous box: x=110-450 -->
  <g transform="translate(110,120)">
    <rect x="0" y="0" width="340" height="210" rx="16" fill="#FFFFFF" stroke="#0D1B2A" stroke-width="5"/>
    <g transform="translate(148,25)">
      <rect x="6" y="4" width="34" height="46" rx="4" fill="#F4F3EF" stroke="#0D1B2A" stroke-width="3.5"/>
      <rect x="0" y="10" width="34" height="46" rx="4" fill="#F4F3EF" stroke="#01696F" stroke-width="3.5"/>
    </g>
    <text x="170" y="112" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#01696F" text-anchor="middle">ANALOGOUS</text>
    <text x="170" y="140" font-family="Arial, sans-serif" font-size="16" fill="#0D1B2A" text-anchor="middle">Compare to a past program</text>
    <text x="170" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#D19900" text-anchor="middle">±50% accuracy</text>
    <text x="170" y="196" font-family="Arial, sans-serif" font-size="14.5" fill="#6B7280" text-anchor="middle">Best pre-Milestone A</text>
  </g>
  <line x1="280" y1="330" x2="280" y2="380" stroke="#0D1B2A" stroke-width="3"/>
  <circle cx="280" cy="380" r="9" fill="#FFFFFF" stroke="#0D1B2A" stroke-width="4"/>

  <!-- Parametric box: x=480-820 -->
  <g transform="translate(480,120)">
    <rect x="0" y="0" width="340" height="210" rx="16" fill="#FFFFFF" stroke="#0D1B2A" stroke-width="5"/>
    <g transform="translate(135,20)">
      <line x1="0" y1="50" x2="70" y2="50" stroke="#0D1B2A" stroke-width="3"/>
      <line x1="0" y1="0" x2="0" y2="50" stroke="#0D1B2A" stroke-width="3"/>
      <polyline points="5,42 25,28 45,33 65,10" fill="none" stroke="#01696F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="5" cy="42" r="4" fill="#0D1B2A"/>
      <circle cx="25" cy="28" r="4" fill="#0D1B2A"/>
      <circle cx="45" cy="33" r="4" fill="#0D1B2A"/>
      <circle cx="65" cy="10" r="4" fill="#0D1B2A"/>
    </g>
    <text x="170" y="112" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#01696F" text-anchor="middle">PARAMETRIC</text>
    <text x="170" y="140" font-family="Arial, sans-serif" font-size="16" fill="#0D1B2A" text-anchor="middle">Statistical model (CERs)</text>
    <text x="170" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#D19900" text-anchor="middle">±25% accuracy</text>
    <text x="170" y="196" font-family="Arial, sans-serif" font-size="14.5" fill="#6B7280" text-anchor="middle">Best early-mid phase</text>
  </g>
  <line x1="650" y1="330" x2="650" y2="380" stroke="#0D1B2A" stroke-width="3"/>
  <circle cx="650" cy="380" r="9" fill="#FFFFFF" stroke="#0D1B2A" stroke-width="4"/>

  <!-- Bottoms-Up box: x=850-1190 -->
  <g transform="translate(850,120)">
    <rect x="0" y="0" width="340" height="210" rx="16" fill="#FFFFFF" stroke="#0D1B2A" stroke-width="5"/>
    <g transform="translate(148,20)">
      <rect x="0" y="0" width="44" height="58" rx="4" fill="none" stroke="#0D1B2A" stroke-width="3.5"/>
      <path d="M8 14 l6 6 l12 -13" fill="none" stroke="#01696F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8 32 l6 6 l12 -13" fill="none" stroke="#01696F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="8" y1="48" x2="26" y2="48" stroke="#0D1B2A" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="170" y="112" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#01696F" text-anchor="middle">BOTTOMS-UP</text>
    <text x="170" y="140" font-family="Arial, sans-serif" font-size="16" fill="#0D1B2A" text-anchor="middle">Task-by-task build</text>
    <text x="170" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#D19900" text-anchor="middle">±10-15% accuracy</text>
    <text x="170" y="196" font-family="Arial, sans-serif" font-size="14.5" fill="#6B7280" text-anchor="middle">Best at Milestone B+</text>
  </g>
  <line x1="1020" y1="330" x2="1020" y2="380" stroke="#0D1B2A" stroke-width="3"/>
  <circle cx="1020" cy="380" r="9" fill="#FFFFFF" stroke="#0D1B2A" stroke-width="4"/>
</svg>
