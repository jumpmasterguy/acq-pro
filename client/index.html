    <!-- ── In-app launch continuation ──────────────────────────────────────
         The native launch screen hands over to this page, and this page's
         first job is to look EXACTLY like it — same teal, same artwork, same
         size and position — until the app knows whether you are signed in.
         Before, the handover showed a 40px logo and a spinner on beige: a
         second, smaller icon between launch and sign-in.

         Android: the launcher foreground, drawn in a 288px box, which is
         how Android draws windowSplashScreenAnimatedIcon (styles.xml).
         iOS: the launch storyboard's image, cover-fit, which is what its
         scaleAspectFill image view does.

         Only ever shown inside the app. A website visitor never matches. -->
    <style>
      #boot-splash { display: none; }
      html.native-boot, html.native-boot body { background: #01696F; }
      html.native-boot #boot-splash {
        display: block; position: fixed; inset: 0; z-index: 2147483000;
        background: #01696F; transition: opacity 220ms ease-out;
      }
      #boot-splash.leaving { opacity: 0; }
      #boot-splash .android {
        position: absolute; left: 50%; top: 50%;
        width: 288px; height: 288px; margin: -144px 0 0 -144px;
      }
      #boot-splash .ios {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      }
    </style>
    <script>
      (function () {
        var ua = navigator.userAgent || '';
        // Any one of three signals: the tag the app adds to its user agent
        // (capacitor.config.ts appendUserAgent), the flag main.tsx stores on
        // every native launch, or Capacitor's bridge if it is already here.
        var inApp = /AcqlerateApp/.test(ua);
        try { inApp = inApp || localStorage.getItem('acq:native') === '1'; } catch (e) {}
        try { inApp = inApp || !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); } catch (e) {}
        if (!inApp) return;
        var root = document.documentElement;
        root.classList.add('native-boot');
        root.setAttribute('data-boot', /Android/i.test(ua) ? 'android' : 'ios');
      })();
    </script>

  <body>
    <div id="boot-splash" aria-hidden="true"></div>
    <script>
      (function () {
        var root = document.documentElement;
        if (!root.classList.contains('native-boot')) return;
        // A real <img>, not a CSS background: the page's load event waits for
        // it, and Android keeps the native launch screen up until that event
        // (MainActivity), so the artwork is always painted before handover.
        var img = document.createElement('img');
        var android = root.getAttribute('data-boot') === 'android';
        img.className = android ? 'android' : 'ios';
        img.src = android ? '/launch/android-mark.png' : '/launch/ios-splash.png';
        img.alt = '';
        document.getElementById('boot-splash').appendChild(img);
        // Failsafe: if the app never starts, do not hide its error behind this.
        window.setTimeout(function () {
          var el = document.getElementById('boot-splash');
          if (el) el.remove();
          root.classList.remove('native-boot');
        }, 10000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
