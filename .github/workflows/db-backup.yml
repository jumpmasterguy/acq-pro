name: Database backup

# Weekly encrypted dump of the production database, emailed to Lucas.
#
# WHY IT WORKS THIS WAY
#
# Railway's own backups need the Pro plan, and this repo is PUBLIC, which
# rules out the obvious alternative: artifacts in a public repo are
# downloadable by anyone, and the dump contains every user's email address and
# password hash. Encrypted or not, that does not belong on a public URL.
#
# So the dump is encrypted with AES-256 and emailed instead. The useful side
# effect is independence: this copy lives neither on Railway nor on GitHub, so
# it survives a problem with either account — which Railway's own backups,
# however good, cannot do.
#
# SECRETS THIS NEEDS  (Settings > Secrets and variables > Actions)
#
#   DATABASE_PUBLIC_URL  Railway > Postgres > Variables > DATABASE_PUBLIC_URL.
#                        Must be the PUBLIC one: the private .railway.internal
#                        host is not reachable from GitHub's runners.
#   BACKUP_PASSPHRASE    A long random passphrase. Generate it once, put it in
#                        a password manager, and never anywhere else. Lose it
#                        and every backup this makes is landfill.
#   RESEND_API_KEY       Already present — the uptime monitor uses it.
#
# HOW TO RESTORE  (do this once now, not for the first time in an emergency)
#
#   gpg --decrypt --batch --passphrase "<BACKUP_PASSPHRASE>" \
#       acqlerate-YYYY-MM-DD.dump.gpg > restore.dump
#
#   pg_restore --clean --if-exists --no-owner \
#       --dbname "postgresql://...a NON-PRODUCTION database..." restore.dump
#
#   Your local pg_restore must be version 18 or newer, for the same reason the
#   dump runs in a container. If it is older:
#     docker run --rm -v "$PWD:/w" -e U="<target url>" postgres:18 \
#       sh -c 'pg_restore --clean --if-exists --no-owner --dbname "$U" /w/restore.dump'
#
# Restore into a scratch database and count the users. A backup nobody has
# ever restored is a hope, not a backup.

on:
  schedule:
    - cron: "17 3 * * 0"     # Sundays, 03:17 UTC. Odd minute to avoid the
                             # top-of-hour crush on GitHub's scheduler.
  workflow_dispatch:         # run it by hand from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Dump the database
        id: dump
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_PUBLIC_URL:-}" ]; then
            echo "DATABASE_PUBLIC_URL secret is not set."
            exit 1
          fi

          STAMP=$(date -u '+%Y-%m-%d')
          FILE="acqlerate-${STAMP}.dump"

          # pg_dump runs inside the official postgres:18 image rather than from
          # a client installed on the runner.
          #
          # The first attempt installed postgresql-client-18 from PGDG and still
          # failed: the runner ships Postgres 16, and Ubuntu's /usr/bin/pg_dump
          # wrapper kept resolving to it even with 18 alongside. pg_dump refuses
          # to dump a server newer than itself -
          #   server version: 18.6; pg_dump version: 16.15
          # Pinning the image to the server's major version makes the match a
          # property of this file, not of whatever the runner has on PATH this
          # month. When Railway moves Postgres to 19, change the tag here.
          docker run --rm \
            -v "$PWD:/out" \
            -e PGURL="$DATABASE_PUBLIC_URL" \
            -e OUT="/out/${FILE}" \
            postgres:18 \
            sh -c 'pg_dump --format=custom --no-owner --no-acl --file="$OUT" "$PGURL"'

          # A dump that "succeeded" but is tiny usually means it connected to
          # the wrong place, or wrote an error where the data should be. Check
          # before trusting it.
          SIZE=$(stat -c%s "$FILE")
          echo "Dump is ${SIZE} bytes"
          if [ "$SIZE" -lt 10240 ]; then
            echo "Dump is implausibly small - treating as a failure."
            exit 1
          fi

          # Read the archive back to prove it is a real, complete dump. Also in
          # the container: pg_restore has the same version rule as pg_dump, so
          # the runner's 16 could not read an 18-format archive either.
          TABLES=$(docker run --rm -v "$PWD:/out" postgres:18 \
            sh -c "pg_restore --list '/out/${FILE}'" | grep -c "TABLE DATA" || true)
          echo "Tables with data: ${TABLES}"
          if [ "$TABLES" -lt 3 ]; then
            echo "Too few tables in the dump - treating as a failure."
            exit 1
          fi

          # Docker wrote it as root; later steps need to read and delete it.
          sudo chown "$(id -u):$(id -g)" "$FILE"

          echo "file=$FILE"     >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP"   >> "$GITHUB_OUTPUT"
          echo "tables=$TABLES" >> "$GITHUB_OUTPUT"

      - name: Encrypt it
        id: encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          FILE: ${{ steps.dump.outputs.file }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "BACKUP_PASSPHRASE secret is not set."
            exit 1
          fi

          # Symmetric AES-256. The passphrase arrives on stdin rather than the
          # command line so it never shows up in the process list.
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --quiet \
            --passphrase-fd 0 --pinentry-mode loopback \
            --symmetric --cipher-algo AES256 \
            --output "${FILE}.gpg" "$FILE"

          rm -f "$FILE"     # plaintext never outlives this step

          ENC_SIZE=$(stat -c%s "${FILE}.gpg")
          echo "Encrypted to ${ENC_SIZE} bytes"
          echo "encfile=${FILE}.gpg" >> "$GITHUB_OUTPUT"
          echo "encsize=${ENC_SIZE}" >> "$GITHUB_OUTPUT"

          # Resend caps attachments at 40MB. Well before that, email stops
          # being a sensible place to keep this and it should move to private
          # object storage. Fail loudly rather than silently stopping backups.
          if [ "$ENC_SIZE" -gt 20971520 ]; then
            echo "Encrypted dump is over 20MB — outgrowing email delivery."
            exit 1
          fi

      - name: Email it
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ENCFILE: ${{ steps.encrypt.outputs.encfile }}
          ENCSIZE: ${{ steps.encrypt.outputs.encsize }}
          STAMP: ${{ steps.dump.outputs.stamp }}
          TABLES: ${{ steps.dump.outputs.tables }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.request

          enc   = os.environ["ENCFILE"]
          stamp = os.environ["STAMP"]

          with open(enc, "rb") as fh:
              payload = base64.b64encode(fh.read()).decode()

          mb = int(os.environ["ENCSIZE"]) / 1_048_576

          body = {
              "from": "Acqlerate Backups <alerts@acqlerate.com>",
              "to": ["lucas@acqlerate.com"],
              "subject": f"Acqlerate database backup — {stamp}",
              "text": (
                  f"Encrypted backup of the production database.\n\n"
                  f"Date:    {stamp}\n"
                  f"Size:    {mb:.1f} MB encrypted\n"
                  f"Tables:  {os.environ['TABLES']} with data\n\n"
                  "AES-256, opens with the passphrase in your password manager.\n\n"
                  "To restore:\n"
                  f"  gpg --decrypt --batch --passphrase '<passphrase>' {enc} > restore.dump\n"
                  "  pg_restore --clean --if-exists --no-owner --dbname '<a NON-production database>' restore.dump\n\n"
                  "Keep this email. Deleting it deletes the backup."
              ),
              "attachments": [{"filename": enc, "content": payload}],
          }

          req = urllib.request.Request(
              "https://api.resend.com/emails",
              data=json.dumps(body).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["RESEND_API_KEY"],
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req) as resp:
              print("Resend responded", resp.status)
          PY

      - name: Say so if any of that failed
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          # A backup that quietly stops running is worse than no backup, because
          # you think you have one. This fires on any failure above.
          curl -sS -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c '
          import json, os
          print(json.dumps({
            "from": "Acqlerate Backups <alerts@acqlerate.com>",
            "to": ["lucas@acqlerate.com"],
            "subject": "Acqlerate database backup FAILED",
            "text": (
              "The weekly database backup did not complete.\n\n"
              "No backup was produced this week. The last good one is whatever "
              "is sitting in your inbox from a previous run.\n\n"
              "Run log: https://github.com/" + os.environ["GITHUB_REPOSITORY"]
              + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]
            ),
          }))')"
