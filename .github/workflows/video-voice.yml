name: Video voiceover (ElevenLabs)
# Manual only. Voices every line of a video script with ElevenLabs and saves
# the audio to the 'video-assets' branch (not main, so the site doesn't redeploy).
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script name (scripts/video/<name>.lines.json)"
        default: "hank-heist"

concurrency:
  group: video-assets-write
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Generate voice lines
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          LINES: scripts/video/${{ inputs.script }}.lines.json
          OUT_DIR: /tmp/vo/${{ inputs.script }}
        run: python3 scripts/video/eleven_vo.py
      - name: Save to the video-assets branch
        run: |
          git config user.name  "Acqlerate Video Bot"
          git config user.email "video-bot@acqlerate.com"
          if git ls-remote --exit-code origin video-assets >/dev/null; then
            git fetch -q origin video-assets
            git worktree add -q /tmp/va -B video-assets origin/video-assets
          else
            git worktree add -q --detach /tmp/va
            cd /tmp/va && git checkout -q --orphan video-assets && git rm -rq . && cd -
          fi
          # keep the branch to audio only: drop anything that isn't vo/
          find /tmp/va -mindepth 1 -maxdepth 1 ! -name .git ! -name vo ! -name media -exec rm -rf {} +
          rm -rf "/tmp/va/vo/${{ inputs.script }}"
          mkdir -p /tmp/va/vo
          cp -r "/tmp/vo/${{ inputs.script }}" "/tmp/va/vo/${{ inputs.script }}"
          cd /tmp/va
          git add -A
          git commit -qm "vo: ${{ inputs.script }} (run ${{ github.run_number }})" || echo "nothing changed"
          git push -q origin video-assets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vo-${{ inputs.script }}
          path: /tmp/vo/
          if-no-files-found: warn
