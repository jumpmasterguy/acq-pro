name: Video bake-off (Higgsfield)
# Manual only. Makes 3 sketch styles + 3 animated test clips so we can pick
# the look and model before building the weekly video pipeline.
on:
  workflow_dispatch:
    inputs:
      max_usd:
        description: "Spend cap in USD (the run stops before generating if the estimate is higher)"
        default: "5"

concurrency:
  group: video-bakeoff
  cancel-in-progress: false

jobs:
  bakeoff:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bake-off
        env:
          HF_API_KEY_ID: ${{ secrets.HF_API_KEY_ID }}
          HF_API_KEY_SECRET: ${{ secrets.HF_API_KEY_SECRET }}
          MAX_USD: ${{ inputs.max_usd }}
          OUT_DIR: video-bakeoff
        run: python3 scripts/video/bakeoff.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-bakeoff
          path: video-bakeoff/
          if-no-files-found: warn
