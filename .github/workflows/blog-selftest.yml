name: Blog generator selftest
# Runs whenever the generator or its helpers change, so a bug shows up the
# day it is pushed instead of at the next Tue/Sat 07:00 UTC post.
on:
  push:
    paths:
      - "scripts/generate_blog_post.py"
      - "scripts/diagram.py"
      - "scripts/dupe_guard.py"
      - "scripts/curriculum_counts.py"
      - ".github/workflows/blog-*.yml"
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/generate_blog_post.py --selftest
